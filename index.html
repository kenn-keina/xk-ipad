html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #fbf4e2;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
#xk-tap {
	position: fixed;
	inset: 0;
	z-index: 10;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.5rem;
	background-color: #fbf4e2;
	color: #3b2a1a;
	font-family: -apple-system, 'Noto Sans', 'Segoe UI', Arial, sans-serif;
	cursor: pointer;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#xk-tap .xk-play {
	width: 9rem;
	height: 9rem;
	border-radius: 50%;
	background-color: #5bc0eb;
	border: 0.4rem solid #3b2a1a;
	display: flex;
	justify-content: center;
	align-items: center;
	box-shadow: 0 0.5rem 0 #3b2a1a;
}

#xk-tap .xk-play::after {
	content: '';
	margin-left: 1rem;
	border-style: solid;
	border-width: 2.4rem 0 2.4rem 3.8rem;
	border-color: transparent transparent transparent #ffffff;
}

#xk-tap .xk-label {
	font-size: 2.2rem;
	font-weight: 700;
}

		<script>
// XoraKids web: Safari (iPad, iPhone) only lets sound start after a tap. Keep a handle on
// every AudioContext the engine makes so the "Tap to play" screen can wake them up inside
// the tap itself, and ask iOS to treat the page as media playback so the silent setting
// does not mute the narration.
(function () {
	window.__xk = { ctxs: [], unlocked: false };
	try {
		if (navigator.audioSession) {
			navigator.audioSession.type = 'playback';
		}
	} catch (e) { /* older Safari: nothing to do */ }
	['AudioContext', 'webkitAudioContext'].forEach(function (name) {
		const Orig = window[name];
		if (typeof Orig !== 'function') {
			return;
		}
		const Wrapped = function (opts) {
			const ctx = opts === undefined ? new Orig() : new Orig(opts);
			window.__xk.ctxs.push(ctx);
			if (window.__xk.unlocked && ctx.state !== 'running') {
				ctx.resume();
			}
			return ctx;
		};
		Wrapped.prototype = Orig.prototype;
		Object.setPrototypeOf(Wrapped, Orig);
		window[name] = Wrapped;
	});
	window.__xkUnlockAudio = function () {
		window.__xk.unlocked = true;
		window.__xk.ctxs.forEach(function (ctx) {
			try {
				if (ctx.state !== 'running') {
					ctx.resume();
				}
				// A one-sample silent sound started inside the tap is what unlocks older iOS.
				const buf = ctx.createBuffer(1, 1, 22050);
				const src = ctx.createBufferSource();
				src.buffer = buf;
				src.connect(ctx.destination);
				src.start(0);
			} catch (e) {
				console.warn('XoraKids: audio unlock failed', e);
			}
		});
	};
}());
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":80051596,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function showTapToPlay() {
		const tap = document.createElement('div');
		tap.id = 'xk-tap';
		tap.setAttribute('role', 'button');
		tap.setAttribute('aria-label', 'Tap to play');
		const play = document.createElement('div');
		play.className = 'xk-play';
		const label = document.createElement('div');
		label.className = 'xk-label';
		label.textContent = 'Tap to play';
		tap.appendChild(play);
		tap.appendChild(label);
		let done = false;
		const go = function (ev) {
			if (done) {
				return;
			}
			done = true;
			ev.preventDefault();
			window.__xkUnlockAudio();
			tap.remove();
			const canvas = document.getElementById('canvas');
			if (canvas) {
				canvas.focus();
			}
		};
		tap.addEventListener('touchend', go);
		tap.addEventListener('click', go);
		document.body.appendChild(tap);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			showTapToPlay();
		}, displayFailureNotice);
	}
}());
		</script>
